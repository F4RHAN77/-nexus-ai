
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#212121;color:white;font-family:Arial}
.app{display:flex;height:100dvh}
.sidebar{width:260px;background:#171717;padding:15px;display:flex;flex-direction:column;flex-shrink:0}
.brand{font-size:23px;font-weight:bold;margin:15px 5px 25px}
.brand span{color:#72e5a1}
button{cursor:pointer}
.newchat{padding:13px;background:#292929;border:1px solid #444;color:white;border-radius:10px;text-align:left}
.history{margin-top:25px;overflow:auto;flex:1}
.history-title{font-size:12px;color:#999;margin:10px}
.chat-item{padding:12px;border-radius:8px;cursor:pointer;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item:hover,.chat-item.active{background:#303030}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #333;gap:15px}
.menu{background:none;border:0;color:white;font-size:23px}
.status{margin-left:auto;color:#72e5a1;font-size:12px}
.messages{flex:1;overflow-y:auto;padding:25px 16px}
.welcome{text-align:center;margin:18vh auto 0}
.welcome h1{font-size:28px}
.welcome p{color:#aaa}
.msg{max-width:780px;margin:20px auto;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#303030;padding:13px 17px;border-radius:18px;width:fit-content;margin-left:auto;max-width:85%}
.bot{padding:8px 3px}
.input-wrap{max-width:800px;width:100%;margin:auto;padding:10px 15px 20px}
.inputbox{display:flex;align-items:flex-end;background:#303030;border:1px solid #555;border-radius:22px;padding:10px;gap:8px}
textarea{flex:1;background:transparent;border:0;outline:0;color:white;font-size:16px;resize:none;max-height:140px;min-height:28px;font-family:Arial;padding:5px}
.send{background:#72e5a1;color:#111;border:0;border-radius:50%;width:38px;height:38px;font-size:20px}
.note{text-align:center;color:#888;font-size:11px;margin-top:10px}
@media(max-width:650px){
.sidebar{position:fixed;z-index:5;top:0;bottom:0;left:-270px;transition:.2s}
.sidebar.open{left:0}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="brand">NEXUS <span>AI</span></div>
<button class="newchat" onclick="newChat()">＋ New Chat</button>
<div class="history">
<div class="history-title">YOUR CHATS</div>
<div id="history"></div>
</div>
</aside>

<main class="main">
<header class="topbar">
<button class="menu" onclick="toggleSidebar()">☰</button>
<b>NEXUS AI</b>
<div class="status">● Online</div>
</header>
<section class="messages" id="messages">
<div class="welcome" id="welcome">
<h1>What can I help with?</h1>
<p>Ask anything. Learn, create and explore.</p>
</div>
</section>
<div class="input-wrap">
<div class="inputbox">
<textarea id="prompt" rows="1" placeholder="Message NEXUS AI..."></textarea>
<button class="send" id="send" onclick="sendMessage()">↑</button>
</div>
<div class="note">NEXUS AI can make mistakes. Check important information.</div>
</div>
</main>
</div>

<script>
const API_URL="https://nexus-ai.pagalkudi14447-6d9.workers.dev";
const input=document.getElementById("prompt");
const messages=document.getElementById("messages");
const historyBox=document.getElementById("history");
const send=document.getElementById("send");

let chats=JSON.parse(localStorage.getItem("nexus_chats")||"[]");
let currentId=null;

function save(){
localStorage.setItem("nexus_chats",JSON.stringify(chats));
}

function newChat(){
currentId=null;
messages.innerHTML='<div class="welcome"><h1>What can I help with?</h1><p>Ask anything. Learn, create and explore.</p></div>';
input.value="";
renderHistory();
document.getElementById("sidebar").classList.remove("open");
}

function renderHistory(){
historyBox.innerHTML="";
chats.slice().reverse().forEach(chat=>{
const item=document.createElement("div");
item.className="chat-item"+(chat.id===currentId?" active":"");
item.textContent=chat.title;
item.onclick=()=>openChat(chat.id);
historyBox.appendChild(item);
});
}

function addMessage(text,type){
const div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;
messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
return div;
}

function openChat(id){
const chat=chats.find(c=>c.id===id);
if(!chat)return;
currentId=id;
messages.innerHTML="";
chat.messages.forEach(m=>addMessage(m.text,m.type));
renderHistory();
document.getElementById("sidebar").classList.remove("open");
}

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("open");
}

async function sendMessage(){
const value=input.value.trim();
if(!value||send.disabled)return;

if(!currentId){
currentId=Date.now().toString();
chats.push({id:currentId,title:value.slice(0,35),messages:[]});
}

const chat=chats.find(c=>c.id===currentId);
chat.messages.push({text:value,type:"user"});
addMessage(value,"user");
input.value="";
send.disabled=true;

const loading=addMessage("NEXUS AI is thinking...","bot");

try{
const response=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:value})
});
const data=await response.json();
if(!response.ok)throw new Error(data.error||"Request failed");

const answer=data.reply||"No response generated.";
loading.textContent=answer;
chat.messages.push({text:answer,type:"bot"});
}catch(error){
loading.textContent="Error: "+error.message;
}
save();
renderHistory();
send.disabled=false;
input.focus();
}

input.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

renderHistory();
</script>
</body>
</html>
