
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>

<style>
:root{--bg:#212121;--sidebar:#171717;--panel:#2f2f2f;--panel-hover:#3a3a3a;--border:#3d3d3d;--text:#ececec;--muted:#a1a1aa;--accent:#10a37f;--accent-hover:#0d8f70}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{height:100dvh;overflow:hidden}
button,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;height:100dvh;width:100%;overflow:hidden}
.sidebar{width:276px;flex:0 0 276px;background:var(--sidebar);display:flex;flex-direction:column;padding:12px;z-index:10;transition:transform .25s ease;border-right:1px solid #252525}
.brand{display:flex;align-items:center;gap:10px;padding:8px 8px 18px}
.logo,.welcome-logo{display:grid;place-items:center;background:linear-gradient(145deg,#19b78d,#08785e);color:#fff;font-weight:800}
.logo{width:34px;height:34px;border-radius:11px;font-size:18px}
.brand-name{font-size:16px;font-weight:700;letter-spacing:.2px}.online{font-size:11px;color:#57c99e;margin-top:3px}
.new-chat{width:100%;padding:11px 12px;border:1px solid #454545;background:transparent;color:var(--text);border-radius:10px;text-align:left;margin:0 0 22px;transition:background .15s}
.new-chat:hover{background:#292929}
.section-label{font-size:11px;color:#858585;font-weight:600;letter-spacing:.5px;padding:0 9px 9px}
.chat-list{overflow-y:auto;flex:1;min-height:0}
.chat-item{display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;color:#d4d4d4;font-size:13px;cursor:pointer;margin-bottom:2px}
.chat-item:hover,.chat-item.active{background:#2b2b2b}
.chat-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.delete-chat{background:none;border:0;color:#aaa;padding:3px 6px;border-radius:5px;font-size:17px;opacity:.65}
.delete-chat:hover{background:#454545;opacity:1}
.sidebar-bottom{border-top:1px solid #303030;padding:13px 8px 5px;color:#929292;font-size:12px;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #303030;background:rgba(33,33,33,.96)}
.top-left{display:flex;align-items:center;gap:12px}
.menu-btn{background:transparent;border:0;color:#e5e5e5;font-size:21px;padding:7px;border-radius:8px}
.menu-btn:hover{background:#383838}
.top-title{font-size:15px;font-weight:650}.top-status{font-size:10px;color:#57c99e;margin-top:2px}
.top-actions{display:flex;gap:7px}
.small-btn{border:1px solid #454545;background:transparent;color:#ddd;padding:7px 11px;border-radius:8px;font-size:12px}
.small-btn:hover{background:#383838;border-color:#666}
.messages{flex:1;overflow-y:auto;padding:30px 22px 42px;scroll-behavior:smooth}
.welcome{max-width:760px;margin:12vh auto 0;text-align:center}
.welcome-logo{width:54px;height:54px;border-radius:18px;margin:0 auto 22px;font-size:26px}
.welcome h1{font-size:28px;font-weight:600;letter-spacing:-.7px;margin:0 0 10px}
.welcome p{color:#aaa;line-height:1.65;font-size:14px;margin:0 auto;max-width:540px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:30px auto;max-width:650px}
.suggestion{background:transparent;border:1px solid #454545;border-radius:12px;padding:14px;text-align:left;color:#dedede;font-size:13px;line-height:1.45;min-height:62px}
.suggestion:hover{background:#2b2b2b;border-color:#666}
.message{max-width:820px;margin:0 auto 26px;display:flex;gap:13px;align-items:flex-start}
.avatar{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#444;color:#fff;font-size:12px;font-weight:700}
.message.user .avatar{background:#315b50}
.message-content{min-width:0;flex:1;padding-top:1px}
.message-name{font-size:12px;color:#aaa;margin:3px 0 8px;font-weight:600}
.message-text{line-height:1.75;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;color:#e7e7e7}
.message-tools{margin-top:10px}
.copy-btn{background:transparent;border:1px solid #444;color:#aaa;padding:5px 9px;border-radius:7px;font-size:11px}
.copy-btn:hover{color:#fff;background:#383838}
.typing{color:#aaa;font-size:13px;padding-top:7px}
.composer-area{padding:12px 20px 18px;background:linear-gradient(transparent,var(--bg) 18%)}
.composer{max-width:820px;margin:auto;border:1px solid #555;background:#2f2f2f;border-radius:24px;padding:11px 12px 11px 17px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 5px 24px #0002}
.composer:focus-within{border-color:#777}
#messageInput{flex:1;resize:none;border:0;outline:0;background:transparent;color:#f5f5f5;min-height:28px;max-height:150px;font-size:14px;line-height:1.55;padding:4px 0}
#messageInput::placeholder{color:#a3a3a3}
.send-btn{border:0;border-radius:50%;width:36px;height:36px;background:#f3f3f3;color:#202020;font-size:18px;flex-shrink:0;display:grid;place-items:center}
.send-btn:hover{background:#d7d7d7}.send-btn:disabled{opacity:.45;cursor:not-allowed}
.disclaimer{text-align:center;color:#858585;font-size:10px;margin-top:10px}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:9}.overlay.show{display:block}
@media(max-width:700px){
 .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(82vw,300px);transform:translateX(-105%);box-shadow:12px 0 35px #0005}
 .sidebar.open{transform:translateX(0)}
 .topbar{height:54px;padding:0 10px}.top-actions{gap:5px}.small-btn{padding:6px 9px;font-size:11px}
 .messages{padding:22px 14px 30px}.welcome{margin-top:9vh}.welcome h1{font-size:24px}
 .suggestions{grid-template-columns:1fr;gap:8px;margin-top:23px}.suggestion{min-height:52px;padding:12px}
 .message{gap:10px;margin-bottom:22px}.message-text{font-size:14px}
 .composer-area{padding:9px 10px 13px}.composer{border-radius:22px;padding:9px 10px 9px 14px}
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <div class="brand-name">NEXUS AI</div>
        <div class="online">● Online</div>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">＋ New Chat</button>

    <div class="section-label">YOUR CONVERSATIONS</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
      NEXUS AI<br>
      Your intelligent AI assistant.
    </div>
  </aside>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div>
          <div class="top-title">NEXUS AI</div>
          <div class="top-status">● Online</div>
        </div>
      </div>

      <div class="top-actions">
        <button class="small-btn" onclick="exportPDF()">PDF</button>
        <button class="small-btn" onclick="exportPPT()">PPT</button>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer-area">
      <div class="composer">
        <textarea id="messageInput"
          placeholder="Message NEXUS AI..."
          rows="1"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
      <div class="disclaimer">
        NEXUS AI can make mistakes. Verify important information.
      </div>
    </div>
  </main>
</div>

<script>
const API_URL = "https://nexus-ai.pagalkudi14447-6d9.workers.dev";

const messagesEl = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

let chats = [];
let currentChatId = null;
let isSending = false;

function makeId() {
  return Date.now().toString() + Math.random().toString(36).slice(2,7);
}

function saveChats() {
  try {
    localStorage.setItem("nexus_ai_chats", JSON.stringify(chats));
  } catch(e) {
    console.error("Chat save error:",e);
  }
}

function loadChats() {
  try {
    chats = JSON.parse(localStorage.getItem("nexus_ai_chats") || "[]");
  } catch(e) {
    chats = [];
  }

  if (!Array.isArray(chats)) chats = [];

  if (chats.length) {
    currentChatId = chats[0].id;
  } else {
    createChat();
  }

  renderChatList();
  renderMessages();
}

function createChat() {
  const chat = {
    id: makeId(),
    title: "New Chat",
    messages: [],
    updatedAt: Date.now()
  };

  chats.unshift(chat);
  currentChatId = chat.id;
  saveChats();
  renderChatList();
  renderMessages();
  return chat;
}

function getCurrentChat() {
  return chats.find(c => c.id === currentChatId);
}

function newChat() {
  createChat();
  input.value = "";
  input.focus();
  closeSidebarOnMobile();
}

function openChat(id) {
  currentChatId = id;
  renderChatList();
  renderMessages();
  closeSidebarOnMobile();
}

function deleteChat(id,event) {
  event.stopPropagation();

  chats = chats.filter(c => c.id !== id);

  if (currentChatId === id) {
    if (chats.length) currentChatId = chats[0].id;
    else createChat();
  }

  saveChats();
  renderChatList();
  renderMessages();
}

function renderChatList() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "chat-item" +
      (chat.id === currentChatId ? " active" : "");

    const title = document.createElement("span");
    title.className = "chat-title";
    title.textContent = "▤ " + (chat.title || "New Chat");

    const del = document.createElement("button");
    del.className = "delete-chat";
    del.textContent = "×";
    del.title = "Delete chat";
    del.onclick = (e) => deleteChat(chat.id,e);

    item.append(title,del);
    item.onclick = () => openChat(chat.id);
    list.appendChild(item);
  });
}

function renderMessages() {
  const chat = getCurrentChat();
  if (!chat) return;

  messagesEl.innerHTML = "";

  if (!chat.messages.length) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";

    const logo = document.createElement("div");
    logo.className = "welcome-logo";
    logo.textContent = "N";

    const heading = document.createElement("h1");
    heading.textContent = "Welcome to NEXUS AI";

    const description = document.createElement("p");
    description.textContent =
      "Your intelligent AI assistant. Ask anything, learn anything, create anything.";

    const suggestions = document.createElement("div");
    suggestions.className = "suggestions";

    [
      "Introduce yourself",
      "Explain computer networking",
      "Help me learn programming",
      "Write a professional email"
    ].forEach(text => {
      const button = document.createElement("button");
      button.className = "suggestion";
      button.textContent = text;
      button.onclick = () => {
        input.value = text;
        sendMessage();
      };
      suggestions.appendChild(button);
    });

    welcome.append(logo,heading,description,suggestions);
    messagesEl.appendChild(welcome);
    return;
  }

  chat.messages.forEach(msg => addMessageToDOM(msg));
  scrollToBottom();
}

function addMessageToDOM(msg) {
  const wrapper = document.createElement("div");
  wrapper.className = "message " + msg.role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = msg.role === "user" ? "U" : "N";

  const content = document.createElement("div");
  content.className = "message-content";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent = msg.role === "user" ? "You" : "NEXUS AI";

  const text = document.createElement("div");
  text.className = "message-text";
  text.textContent = msg.content || "";

  content.append(name,text);

  if (msg.role === "assistant") {
    const tools = document.createElement("div");
    tools.className = "message-tools";

    const copy = document.createElement("button");
    copy.className = "copy-btn";
    copy.textContent = "Copy response";
    copy.onclick = () => copyText(msg.content || "");

    tools.appendChild(copy);
    content.appendChild(tools);
  }

  wrapper.append(avatar,content);
  messagesEl.appendChild(wrapper);
}

function addTyping() {
  const wrapper = document.createElement("div");
  wrapper.className = "message";
  wrapper.id = "typingIndicator";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "N";

  const text = document.createElement("div");
  text.className = "typing";
  text.textContent = "NEXUS AI is thinking...";

  wrapper.append(avatar,text);
  messagesEl.appendChild(wrapper);
  scrollToBottom();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    alert("Copied!");
  } catch(e) {
    alert("Copy failed. Please select and copy the text.");
  }
}

async function sendMessage() {
  const value = input.value.trim();

  if (!value || isSending) return;

  let chat = getCurrentChat();
  if (!chat) chat = createChat();

  isSending = true;
  sendBtn.disabled = true;

  if (!chat.messages.length) {
    chat.title = value.slice(0,35);
  }

  chat.messages.push({
    role:"user",
    content:value
  });

  chat.updatedAt = Date.now();
  input.value = "";
  input.style.height = "auto";

  saveChats();
  renderChatList();
  renderMessages();
  addTyping();

  try {
    // Send recent conversation history to the Worker.
    const history = chat.messages.slice(-15);

    const response = await fetchWithRetry(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:value,
        messages:history
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.error || data.message ||
        "Server error: HTTP " + response.status
      );
    }

    const reply = data.reply || data.response ||
      data.result || data.output;

    if (typeof reply !== "string" || !reply.trim()) {
      throw new Error("AI ne empty response diya. Worker response check karo.");
    }

    chat.messages.push({
      role:"assistant",
      content:reply.trim()
    });

  } catch(error) {
    console.error("NEXUS AI error:",error);

    chat.messages.push({
      role:"assistant",
      content:
        "Sorry, NEXUS AI se connection nahi ho paya.\n\n" +
        "Error: " + (error.message || "Unknown error") +
        "\n\nInternet connection aur Cloudflare Worker check karein."
    });
  }

  document.getElementById("typingIndicator")?.remove();

  chat.updatedAt = Date.now();
  saveChats();
  renderChatList();
  renderMessages();

  isSending = false;
  sendBtn.disabled = false;
  input.focus();
}

async function fetchWithRetry(url,options) {
  let lastError;

  for (let attempt=0; attempt<2; attempt++) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(),45000);

      try {
        return await fetch(url,{
          ...options,
          signal:controller.signal
        });
      } finally {
        clearTimeout(timeout);
      }
    } catch(error) {
      lastError = error;
      if (attempt === 0) {
        await new Promise(resolve => setTimeout(resolve,900));
      }
    }
  }

  if (lastError?.name === "AbortError") {
    throw new Error("Request timeout. Server ne 45 seconds mein reply nahi diya.");
  }

  throw new Error(
    "Failed to fetch. Internet, Worker URL ya CORS check karo."
  );
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function closeSidebarOnMobile() {
  if (window.innerWidth <= 700) {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  }
}

input.addEventListener("input",() => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight,150) + "px";
});

input.addEventListener("keydown",event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

function getConversationText() {
  const chat = getCurrentChat();
  if (!chat || !chat.messages.length) {
    alert("Export karne ke liye pehle conversation karo.");
    return null;
  }

  return chat;
}

async function exportPDF() {
  const chat = getConversationText();
  if (!chat) return;

  if (!window.jspdf) {
    alert("PDF library load nahi hui. Internet check karo.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  let y = 20;

  pdf.setFontSize(19);
  pdf.text("NEXUS AI",20,y);
  y += 12;

  pdf.setFontSize(11);
  pdf.text("Conversation: " + chat.title,20,y);
  y += 12;

  for (const msg of chat.messages) {
    const label = msg.role === "user" ? "You:" : "NEXUS AI:";
    const lines = pdf.splitTextToSize(
      label + " " + (msg.content || ""),170
    );

    if (y + lines.length * 6 > 275) {
      pdf.addPage();
      y = 20;
    }

    pdf.setFont("helvetica","bold");
    pdf.text(label,20,y);
    y += 6;

    pdf.setFont("helvetica","normal");

    const contentLines = pdf.splitTextToSize(
      msg.content || "",170
    );

    for (const line of contentLines) {
      if (y > 280) {
        pdf.addPage();
        y = 20;
      }
      pdf.text(line,20,y);
      y += 6;
    }

    y += 7;
  }

  pdf.save("NEXUS-AI-Conversation.pdf");
}

async function exportPPT() {
  const chat = getConversationText();
  if (!chat) return;

  if (!window.PptxGenJS) {
    alert("PPT library load nahi hui. Internet check karo.");
    return;
  }

  const pptx = new pptxgen();
  pptx.layout = "LAYOUT_WIDE";
  pptx.author = "NEXUS AI";
  pptx.subject = "NEXUS AI Conversation";
  pptx.title = chat.title;

  let slide = pptx.addSlide();
  slide.background = { color:"0B0B18" };

  slide.addText("NEXUS AI",{
    x:0.7,y:0.6,w:12,h:0.8,
    fontSize:30,bold:true,color:"A78BFA"
  });

  slide.addText(chat.title,{
    x:0.7,y:1.7,w:11.5,h:1,
    fontSize:22,color:"FFFFFF"
  });

  let count = 0;

  for (const msg of chat.messages) {
    if (count % 2 === 0) {
      slide = pptx.addSlide();
      slide.background = { color:"0B0B18" };
    }

    const label = msg.role === "user" ? "YOU" : "NEXUS AI";
    const color = msg.role === "user" ? "60A5FA" : "A78BFA";

    slide.addText(label,{
      x:0.6,y:0.5,w:11.8,h:0.4,
      fontSize:16,bold:true,color
    });

    slide.addText(msg.content || "",{
      x:0.6,y:1.1,w:11.8,h:5.5,
      fontSize:15,color:"FFFFFF",
      breakLine:false, valign:"top",
      margin:0.1,fit:"shrink"
    });

    count++;
  }

  await pptx.writeFile({fileName:"NEXUS-AI-Presentation.pptx"});
}

loadChats();
</script>
</body>
</html>
