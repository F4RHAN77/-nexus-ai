<style>

body{height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 65% -20%,rgba(91,74,190,.23),transparent 43%),radial-gradient(ellipse at 10% 100%,rgba(20,153,190,.10),transparent 42%),var(--bg)}
button,input,textarea{font:inherit}button{cursor:pointer}

.logo,.welcome-logo{display:grid;place-items:center;color:#fff;font-weight:850;position:relative;isolation:isolate;background:linear-gradient(135deg,#a855f7 0%,#5865f2 48%,#19c7d8 100%);box-shadow:0 8px 30px rgba(103,91,245,.3),inset 0 1px 0 #ffffff80}

.top-left{display:flex;align-items:center;gap:13px}.menu-btn{background:#131a2c;border:1px solid var(--line);color:#e8ebff;font-size:19px;padding:8px 10px;border-radius:11px;transition:.2s}.menu-btn:hover{background:#202a45;border-color:#7669d9}

.copy-btn:hover{color:#fff;background:#26314e;border-color:#6d70c9}

.composer:focus-within{border-color:rgba(139,124,255,.65);box-shadow:0 0 0 3px rgba(139,92,246,.09),0 12px 45px #0005}
#messageInput{flex:1;resize:none;border:0;outline:0;background:transparent;color:#f5f6ff;min-height:28px;max-height:150px;font-size:14px;line-height:1.6;padding:5px 0}

.send-btn:hover{filter:brightness(1.13);transform:translateY(-2px)}.send-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

@media(min-width:1100px){.messages{padding-top:38px}.welcome{margin-top:9vh}.composer-area{padding-bottom:22px}}

 .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(84vw,310px);transform:translateX(-105%);box-shadow:18px 0 45px #0009}
 .sidebar.open{transform:translateX(0)}
 .topbar{height:59px;padding:0 12px}.top-actions{gap:6px}.small-btn{padding:7px 10px;font-size:10px}
 .messages{padding:20px 14px 27px}.welcome{margin-top:8vh}.welcome-logo{width:67px;height:67px;border-radius:22px;font-size:30px}.welcome h1{font-size:29px;letter-spacing:-1px}.welcome p{font-size:13px;padding:0 9px}
 .suggestions{grid-template-columns:1fr;gap:9px;margin-top:25px}.suggestion{min-height:70px;padding:13px 15px;border-radius:14px}
 .suggestion .s-icon{display:inline-block;margin:0 9px 0 0;font-size:16px;vertical-align:middle}

 #messageInput{font-size:13px}.send-btn{width:37px;height:37px;border-radius:12px}
}

.message-text h1,.message-text h2,.message-text h3{color:#f3f4ff;line-height:1.35;margin:17px 0 8px}

.message-text ul{padding-left:22px;margin:8px 0}.message-text li{margin:5px 0}

.code-block code{display:block;padding:14px;color:#c9d6ff;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}

.copy-code{background:#27314c;color:#dfe6ff;border:1px solid #465276;border-radius:6px;padding:4px 8px;font-size:10px}

</style>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <div class="brand-name">NEXUS AI</div>
        <div class="online">● Online</div>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">＋ New Chat</button>

    <div class="search-wrap"><span>⌕</span><input id="chatSearch" type="search" placeholder="Search conversations..." oninput="renderChatList()"></div>
    <div class="section-label">YOUR CONVERSATIONS</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
      NEXUS AI<br>
      Your intelligent AI assistant.
    </div>
  </aside>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div>
          <div class="top-title">NEXUS AI</div>
          <div class="top-status">● Online</div>
        </div>
      </div>

      <div class="top-actions">
        <button class="small-btn" onclick="exportPDF()">PDF</button>
        <button class="small-btn" onclick="exportPPT()">PPT</button>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer-area">
      <div class="composer">
        <textarea id="messageInput"
          placeholder="Message NEXUS AI..."
          rows="1"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
      <div class="disclaimer">
        NEXUS AI can make mistakes. Verify important information.
      </div>
    </div>
  </main>
</div>

<script>
const API_URL = "https://nexus-ai.pagalkudi14447-6d9.workers.dev"; // Cloudflare Worker endpoint

const messagesEl = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

let chats = [];
let currentChatId = null;
let isSending = false;

function makeId() {
  return Date.now().toString() + Math.random().toString(36).slice(2,7);
}

function saveChats() {
  try {
    localStorage.setItem("nexus_ai_chats", JSON.stringify(chats));
  } catch(e) {
    console.error("Chat save error:",e);
  }
}

function loadChats() {
  try {
    chats = JSON.parse(localStorage.getItem("nexus_ai_chats") || "[]");
  } catch(e) {
    chats = [];
  }

  if (!Array.isArray(chats)) chats = [];

  if (chats.length) {
    currentChatId = chats[0].id;
  } else {
    createChat();
  }

  renderChatList();
  renderMessages();
}

function createChat() {
  const chat = {
    id: makeId(),
    title: "New Chat",
    messages: [],
    updatedAt: Date.now()
  };

  chats.unshift(chat);
  currentChatId = chat.id;
  saveChats();
  renderChatList();
  renderMessages();
  return chat;
}

function getCurrentChat() {
  return chats.find(c => c.id === currentChatId);
}

function newChat() {
  createChat();
  input.value = "";
  input.focus();
  closeSidebarOnMobile();
}

function openChat(id) {
  currentChatId = id;
  renderChatList();
  renderMessages();
  closeSidebarOnMobile();
}

function deleteChat(id,event) {
  event.stopPropagation();

  chats = chats.filter(c => c.id !== id);

  if (currentChatId === id) {
    if (chats.length) currentChatId = chats[0].id;
    else createChat();
  }

  saveChats();
  renderChatList();
  renderMessages();
}

function renderChatList() {
  const list = document.getElementById("chatList");
  const query = (document.getElementById("chatSearch")?.value || "").trim().toLowerCase();
  list.innerHTML = "";

  const filtered = [...chats]
    .sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0))
    .filter(chat => (chat.title || "New Chat").toLowerCase().includes(query));

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.style.cssText = "padding:12px 10px;color:#7883a1;font-size:11px";
    empty.textContent = query ? "No matching conversations" : "Your chats will appear here";
    list.appendChild(empty);
    return;
  }

  filtered.forEach(chat => {
    const item = document.createElement("div");
    item.className = "chat-item" +
      (chat.id === currentChatId ? " active" : "");

    const title = document.createElement("span");
    title.className = "chat-title";
    title.textContent = "▤ " + (chat.title || "New Chat");

    const del = document.createElement("button");
    del.className = "delete-chat";
    del.textContent = "×";
    del.title = "Delete chat";
    del.onclick = (e) => deleteChat(chat.id,e);

    item.append(title,del);
    item.onclick = () => openChat(chat.id);
    list.appendChild(item);
  });
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

function renderMarkdown(value) {
  const source = String(value || "");
  const blocks = [];
  let safe = escapeHTML(source).replace(/`{3}([\w-]*)\n([\s\S]*?)`{3}/g, (_,lang,code) => {
    const key = "%%CODE" + blocks.length + "%%";
    blocks.push('<pre class="code-block"><div class="code-head">' +
      escapeHTML(lang || "code") + '<button class="copy-code" type="button" data-code="' +
      encodeURIComponent(code) + '">Copy code</button></div><code>' + code + '</code></pre>');
    return key;
  });
  safe = safe.replace(/^### (.+)$/gm,"<h3>$1</h3>")
    .replace(/^## (.+)$/gm,"<h2>$1</h2>")
    .replace(/^# (.+)$/gm,"<h1>$1</h1>")
    .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/`([^`]+)`/g,'<code class="inline-code">$1</code>')
    .replace(/^[-*] (.+)$/gm,"<li>$1</li>")
    .replace(/(?:<li>.*<\/li>\n?)+/g, match => "<ul>" + match + "</ul>")
    .replace(/\n/g,"<br>");
  safe = safe.replace(/%%CODE(\d+)%%/g,(_,i)=>blocks[Number(i)] || "");
  return safe;
}

function renderMessages() {
  const chat = getCurrentChat();
  if (!chat) return;

  messagesEl.innerHTML = "";

  if (!chat.messages.length) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";

    const logo = document.createElement("div");
    logo.className = "welcome-logo";
    logo.textContent = "N";

    const eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = "✦ YOUR AI WORKSPACE";

    const heading = document.createElement("h1");
    heading.innerHTML = 'Think bigger. <span class="gradient-text">Create with NEXUS.</span>';

    const description = document.createElement("p");
    description.textContent =
      "A smarter space to explore ideas, solve problems, learn new skills and bring your work to life.";

    const suggestions = document.createElement("div");
    suggestions.className = "suggestions";

    [
      ["✦","Introduce yourself","Meet your AI assistant"],
      ["⌘","Explain computer networking","Learn a complex topic simply"],
      ["⌁","Help me learn programming","Build skills step by step"],
      ["✎","Write a professional email","Create polished writing"]
    ].forEach(([icon,label,sub]) => {
      const button = document.createElement("button");
      button.className = "suggestion";
      const iconEl = document.createElement("span");
      iconEl.className = "s-icon";
      iconEl.textContent = icon;
      const labelEl = document.createElement("strong");
      labelEl.textContent = label;
      const subEl = document.createElement("div");
      subEl.style.cssText = "color:#8994b2;font-size:11px;margin-top:4px";
      subEl.textContent = sub;
      button.append(iconEl,labelEl,subEl);
      button.onclick = () => {
        input.value = label;
        sendMessage();
      };
      suggestions.appendChild(button);
    });

    welcome.append(logo,eyebrow,heading,description,suggestions);
    messagesEl.appendChild(welcome);
    return;
  }

  chat.messages.forEach(msg => addMessageToDOM(msg));
  scrollToBottom();
}

function addMessageToDOM(msg) {
  const wrapper = document.createElement("div");
  wrapper.className = "message " + msg.role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = msg.role === "user" ? "U" : "N";

  const content = document.createElement("div");
  content.className = "message-content";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent = msg.role === "user" ? "You" : "NEXUS AI";

  const text = document.createElement("div");
  text.className = "message-text";
  text.innerHTML = msg.role === "assistant"
    ? renderMarkdown(msg.content || "")
    : escapeHTML(msg.content || "").replace(/\\n/g,"<br>");

  content.append(name,text);

  if (msg.role === "assistant") {
    text.querySelectorAll(".copy-code").forEach(button => {
      button.addEventListener("click", () => {
        const code = decodeURIComponent(button.dataset.code || "");
        copyText(code);
        button.textContent = "Copied";
      });
    });
    const tools = document.createElement("div");
    tools.className = "message-tools";

    const copy = document.createElement("button");
    copy.className = "copy-btn";
    copy.textContent = "Copy response";
    copy.onclick = () => copyText(msg.content || "");

    tools.appendChild(copy);
    content.appendChild(tools);
  }

  wrapper.append(avatar,content);
  messagesEl.appendChild(wrapper);
}

function addTyping() {
  const wrapper = document.createElement("div");
  wrapper.className = "message";
  wrapper.id = "typingIndicator";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "N";

  const text = document.createElement("div");
  text.className = "typing";
  text.textContent = "NEXUS AI is thinking...";

  wrapper.append(avatar,text);
  messagesEl.appendChild(wrapper);
  scrollToBottom();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    alert("Copied!");
  } catch(e) {
    alert("Copy failed. Please select and copy the text.");
  }
}

async function sendMessage() {
  const value = input.value.trim();

  if (!value || isSending) return;

  let chat = getCurrentChat();
  if (!chat) chat = createChat();

  isSending = true;
  sendBtn.disabled = true;

  if (!chat.messages.length) {
    chat.title = value.slice(0,35);
  }

  chat.messages.push({
    role:"user",
    content:value
  });

  chat.updatedAt = Date.now();
  input.value = "";
  input.style.height = "auto";

  saveChats();
  renderChatList();
  renderMessages();
  addTyping();

  try {
    // Send recent conversation history to the Worker.
    const history = chat.messages.slice(-15);

    const response = await fetchWithRetry(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:value,
        messages:history
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.error || data.message ||
        "Server error: HTTP " + response.status
      );
    }

    const reply = data.reply || data.response ||
      data.result || data.output;

    if (typeof reply !== "string" || !reply.trim()) {
      throw new Error("AI ne empty response diya. Worker response check karo.");
    }

    chat.messages.push({
      role:"assistant",
      content:reply.trim()
    });

  } catch(error) {
    console.error("NEXUS AI error:",error);

    chat.messages.push({
      role:"assistant",
      content:
        "Sorry, NEXUS AI se connection nahi ho paya.\n\n" +
        "Error: " + (error.message || "Unknown error") +
        "\n\nInternet connection aur Cloudflare Worker check karein."
    });
  }

  document.getElementById("typingIndicator")?.remove();

  chat.updatedAt = Date.now();
  saveChats();
  renderChatList();
  renderMessages();

  isSending = false;
  sendBtn.disabled = false;
  input.focus();
}

async function fetchWithRetry(url,options) {
  let lastError;

  for (let attempt=0; attempt<2; attempt++) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(),45000);

      try {
        return await fetch(url,{
          ...options,
          signal:controller.signal
        });
      } finally {
        clearTimeout(timeout);
      }
    } catch(error) {
      lastError = error;
      if (attempt === 0) {
        await new Promise(resolve => setTimeout(resolve,900));
      }
    }
  }

  if (lastError?.name === "AbortError") {
    throw new Error("Request timeout. Server ne 45 seconds mein reply nahi diya.");
  }

  throw new Error(
    "Failed to fetch. Internet, Worker URL ya CORS check karo."
  );
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  }
});

function closeSidebarOnMobile() {
  if (window.innerWidth <= 700) {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");

}

input.addEventListener("input",() => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight,150) + "px";
});

input.addEventListener("keydown",event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

function getConversationText() {
  const chat = getCurrentChat();
  if (!chat || !chat.messages.length) {
    alert("Export karne ke liye pehle conversation karo.");
    return null;
  }

  return chat;
}

async function exportPDF() {
  const chat = getConversationText();
  if (!chat) return;

  if (!window.jspdf) {
    alert("PDF library load nahi hui. Internet check karo.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  let y = 20;

  pdf.setFontSize(19);
  pdf.text("NEXUS AI",20,y);
  y += 12;

  pdf.setFontSize(11);
  pdf.text("Conversation: " + chat.title,20,y);
  y += 12;

  for (const msg of chat.messages) {
    const label = msg.role === "user" ? "You:" : "NEXUS AI:";
    const lines = pdf.splitTextToSize(
      label + " " + (msg.content || ""),170
    );

    if (y + lines.length * 6 > 275) {
      pdf.addPage();
      y = 20;
    }

    pdf.setFont("helvetica","bold");
    pdf.text(label,20,y);
    y += 6;

    pdf.setFont("helvetica","normal");

    const contentLines = pdf.splitTextToSize(
      msg.content || "",170
    );

    for (const line of contentLines) {
      if (y > 280) {
        pdf.addPage();
        y = 20;
      }
      pdf.text(line,20,y);
      y += 6;
    }

    y += 7;
  }

  pdf.save("NEXUS-AI-Conversation.pdf");
}

async function exportPPT() {
  const chat = getConversationText();
  if (!chat) return;

  const PptxGenJS = window.pptxgen || window.PptxGenJS || window.pptxgenjs;
  if (!PptxGenJS) {
    alert("PPT library load nahi hui. Page refresh karke try karo.");
    return;
  }
  const pptx = new PptxGenJS();
  pptx.layout = "LAYOUT_WIDE";
  pptx.author = "NEXUS AI";
  pptx.subject = "NEXUS AI Conversation";
  pptx.title = chat.title;

  let slide = pptx.addSlide();
  slide.background = { color:"0B0B18" };

  slide.addText("NEXUS AI",{
    x:0.7,y:0.6,w:12,h:0.8,
    fontSize:30,bold:true,color:"A78BFA"
  });

  slide.addText(chat.title,{
    x:0.7,y:1.7,w:11.5,h:1,
    fontSize:22,color:"FFFFFF"
  });

  let count = 0;

  for (const msg of chat.messages) {
    if (count % 2 === 0) {
      slide = pptx.addSlide();
      slide.background = { color:"0B0B18" };
    }

    const label = msg.role === "user" ? "YOU" : "NEXUS AI";
    const color = msg.role === "user" ? "60A5FA" : "A78BFA";

    slide.addText(label,{
      x:0.6,y:0.5,w:11.8,h:0.4,
      fontSize:16,bold:true,color
    });

    slide.addText(msg.content || "",{
      x:0.6,y:1.1,w:11.8,h:5.5,
      fontSize:15,color:"FFFFFF",
      breakLine:false, valign:"top",
      margin:0.1,fit:"shrink"
    });

    count++;
  }

  await pptx.writeFile({fileName:"NEXUS-AI-Presentation.pptx"});
}
