<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:white;font-family:Arial,sans-serif}
header{height:65px;padding:15px 20px;border-bottom:1px solid #252936;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:23px;font-weight:bold;color:#8b9cff}
.logo span{color:white}
.status{font-size:12px;color:#72e5a1}
main{max-width:800px;margin:auto;height:calc(100dvh - 130px);display:flex;flex-direction:column;padding:20px}
.welcome{text-align:center;margin:auto 0}
.welcome h1{font-size:32px;margin-bottom:10px}
.welcome p{color:#9299aa}
#messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:15px}
.msg{padding:13px 16px;border-radius:15px;max-width:85%;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#394b9b;align-self:flex-end}
.bot{background:#1b202b;align-self:flex-start}
.input-area{display:flex;gap:10px;padding:12px;border:1px solid #303747;border-radius:15px;background:#151923}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:16px}
button{background:#7185ff;border:0;border-radius:10px;padding:12px 17px;color:white;font-weight:bold}
button:active{opacity:.7}
.note{text-align:center;color:#777f91;font-size:11px;margin-top:10px}
</style>
</head>
<body>
<header>
<div class="logo">NEXUS <span>AI</span></div>
<div class="status">● Demo Mode</div>
</header>
<main>
<div class="welcome" id="welcome">
<h1>Welcome to NEXUS AI</h1>
<p>Your intelligent assistant starts here.</p>
</div>
<div id="messages"></div>
<div class="input-area">
<input id="prompt" placeholder="Message NEXUS AI..." autocomplete="off">
<button onclick="sendMessage()">Send ➤</button>
</div>
<div class="note">NEXUS AI • Preview Version</div>
</main>
<script>
const input=document.getElementById("prompt");
const messages=document.getElementById("messages");
function sendMessage(){
const value=input.value.trim();
if(!value)return;
document.getElementById("welcome").style.display="none";
const user=document.createElement("div");
user.className="msg user";
user.textContent=value;
messages.appendChild(user);
const bot=document.createElement("div");
bot.className="msg bot";
bot.textContent="Welcome to NEXUS AI! Your chat interface is working. AI connection is not enabled yet. We will connect the AI brain in the next stage.";
messages.appendChild(bot);
input.value="";
messages.scrollTop=messages.scrollHeight;
}
input.addEventListener("keydown",e=>{
if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
